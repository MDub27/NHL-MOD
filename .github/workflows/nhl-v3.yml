name: NHL 4.5 Development Manual

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Requested NHL game date YYYY-MM-DD'
        required: true
        type: string
      mode:
        description: 'Combined report and/or chronological moneyline backtest'
        required: true
        default: all
        type: choice
        options:
          - all
          - predict
          - backtest
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_DATE: ${{ inputs.date }}
      RUN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install moneyline dependencies
        run: python -m pip install -r requirements-v3.txt
      - name: Test new data safeguards and moneyline
        run: |
          mkdir -p output/v3
          python -m unittest discover -s tests -p test_v3.py -v 2>&1 | tee output/v3/tests-v3.txt
          python -m unittest discover -s tests -p test_player_features.py -v 2>&1 | tee output/v3/tests-player.txt
          python -m pip freeze > output/v3/environment.txt
      - name: Check preserved V2 known regression
        continue-on-error: true
        run: python -m unittest discover -s tests -p test_nhl_v2.py -v 2>&1 | tee output/v3/tests-v2.txt
      - name: Restore validated compact data cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/v3
          key: nhl-v3-${{ hashFiles('nhl_data.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhl-v3-${{ hashFiles('nhl_data.py') }}-
      - name: Run combined pipeline
        run: python nhl_report.py --date "$TARGET_DATE" --mode "$RUN_MODE"
      - name: Save validated compact data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/v3
          key: nhl-v3-${{ hashFiles('nhl_data.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload report, backtest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-development-${{ inputs.date }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/v3/
          if-no-files-found: error
          retention-days: 90
